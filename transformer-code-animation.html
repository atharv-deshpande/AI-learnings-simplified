<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformer for Translation — animated code walkthrough</title>
<style>
  :root{--bg:#070C12;--panel:#111A26;--edge:#22303F;--text:#E6EDF3;--dim:#93A6B8;--teal:#2DD4BF;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:Arial,Helvetica,sans-serif;padding:14px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{font-size:13px;color:var(--dim);margin:0 0 12px}
  #stage{background:#0A1018;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
  .controls{display:flex;align-items:center;gap:10px;margin-top:12px}
  button{background:var(--panel);color:var(--text);border:1px solid var(--edge);
         border-radius:8px;padding:9px 13px;font-size:15px;cursor:pointer;font-family:inherit}
  button:active{background:#1b2836}
  #play{min-width:52px;font-size:16px;border-color:var(--teal);color:var(--teal)}
  #seek{flex:1;accent-color:var(--teal);height:26px}
  #time{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
  #nowname{margin-top:10px;font-size:14px;color:var(--teal);text-transform:uppercase;letter-spacing:2px}
  #chapters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chapter{font-size:13px;padding:7px 11px;color:var(--dim);text-align:left}
  .chapter.active{border-color:var(--teal);color:var(--text);background:#132430}
  .foot{margin-top:16px;font-size:12px;color:#5A6B7D;line-height:1.5}
</style>
</head>
<body>
<h1>Transformer for Translation — animated walkthrough</h1>
<p class="sub">Eleven scenes: each file of the project, then the whole thing as one unit. Tap a chapter to jump.</p>
<div id="stage"></div>
<div class="controls">
  <button id="play">▶</button>
  <button id="back">−5s</button>
  <button id="fwd">+5s</button>
  <input id="seek" type="range" min="0" max="1" value="0" step="1">
  <span id="time">0:00 / 0:00</span>
</div>
<div id="nowname"></div>
<div id="chapters"></div>
<p class="foot">Rendered live with Motion Canvas — this page contains the full animation engine, so it works offline.</p>
